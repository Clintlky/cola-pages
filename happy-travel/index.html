<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幸福旅行团</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #ffffff;
  color: #1d1d1f;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 24px 20px;
  line-height: 1.9;
  -webkit-font-smoothing: antialiased;
}
#game {
  max-width: 440px;
  width: 100%;
  padding-bottom: 80px;
}
#score-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 14px 24px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 0.5px solid #e5e5e5;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  z-index: 100;
  font-size: 14px;
}
#score-label { color: #86868b; margin-right: 6px; }
#score-value { color: #1d1d1f; font-weight: 600; font-size: 17px; transition: color 0.3s; }
#score-value.up { color: #34c759; }
#score-value.down { color: #ff3b30; }

.scene-desc {
  color: #1d1d1f;
  font-size: 17px;
  margin-bottom: 18px;
  line-height: 2;
}
.dialogue {
  margin-bottom: 16px;
  font-size: 17px;
  line-height: 2;
}
.char-name {
  font-weight: 600;
  margin-right: 2px;
}
.char-name[data-char="导游阿芳"] { color: #e85d75; }
.char-name[data-char="王姐"] { color: #d35400; }
.char-name[data-char="戴耳机的"] { color: #5b7a99; }
.char-name[data-char="拍照叔"] { color: #7b6b43; }
.char-name[data-char="情侣女"] { color: #c0392b; }
.char-name[data-char="情侣男"] { color: #c0392b; }
.char-name[data-char="安静女生"] { color: #8e7cc3; }
.char-name[data-char="旁白"] { color: #6e6e73; }
.char-name[data-char="老伴"] { color: #6e6e73; }
.char-name[data-char="阿姨"] { color: #6e6e73; }
.narrator {
  color: #6e6e73;
  font-size: 16px;
  margin-bottom: 16px;
  line-height: 1.9;
}

.options { margin-top: 28px; }
.option-btn {
  display: block;
  width: 100%;
  padding: 16px 18px;
  margin-bottom: 12px;
  background: #f5f5f7;
  border: none;
  border-radius: 12px;
  color: #1d1d1f;
  font-size: 16px;
  line-height: 1.7;
  text-align: left;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.option-btn:hover { background: #e8e8ed; }
.option-btn:active { background: #e8e8ed; transform: scale(0.98); }
.option-btn.selected { background: #3a7bd5; color: #ffffff; }
.option-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

/* Satisfaction picker */
.satisfaction-picker {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 0.5px solid #e5e5e5;
}
.sat-label {
  font-size: 14px;
  color: #86868b;
  margin-bottom: 12px;
}
.sat-options {
  display: flex;
  gap: 8px;
}
.sat-btn {
  flex: 1;
  padding: 12px 4px;
  background: #f5f5f7;
  border: none;
  border-radius: 10px;
  color: #1d1d1f;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: background 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.sat-btn:hover { background: #e8e8ed; }
.sat-btn:active { background: #e8e8ed; }
.sat-btn.sat-selected { background: #3a7bd5; color: #ffffff; }
.sat-btn.sat-dimmed { opacity: 0.25; }
.sat-btn:disabled { cursor: default; }

/* Rarity tags */
.rarity-tag {
  display: inline-block;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 100px;
  margin-bottom: 18px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.rarity-N { background: #e8e8ed; color: #86868b; }
.rarity-R { background: #fff3cd; color: #986a00; }
.rarity-SR { background: #f3e8ff; color: #7c3aed; }
.rarity-SSR { background: #fee2e2; color: #dc2626; font-size: 13px; padding: 4px 12px; }

.flash-white { animation: flashWhite 0.6s; }
@keyframes flashWhite {
  0% { opacity: 1; }
  15% { opacity: 0; }
  30% { opacity: 1; }
  45% { opacity: 0.8; }
  60% { opacity: 1; }
}
.shake { animation: shake 0.4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-4px); }
  40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}

.event-divider {
  border: none;
  border-top: 0.5px solid #e5e5e5;
  margin: 48px 0;
}

.ending-section {
  margin-top: 36px;
  padding-top: 28px;
  border-top: 0.5px solid #e5e5e5;
}
.ending-text {
  color: #6e6e73;
  font-size: 15px;
  margin-bottom: 14px;
  line-height: 1.8;
}
.ending-highlight {
  color: #1d1d1f;
  font-size: 16px;
  margin-bottom: 14px;
}
.ending-score {
  font-size: 34px;
  color: #1d1d1f;
  font-weight: 700;
  margin: 24px 0;
  letter-spacing: -1px;
}

.restart-btn {
  display: inline-block;
  margin-top: 36px;
  padding: 16px 36px;
  background: #1d1d1f;
  border: none;
  border-radius: 12px;
  color: #ffffff;
  font-size: 16px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.restart-btn:hover { opacity: 0.85; }

#intro-screen {
  min-height: 80vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
#intro-screen h1 {
  font-size: 28px;
  color: #1d1d1f;
  margin-bottom: 12px;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.hidden { display: none !important; }
.fade-in { animation: fadeIn 0.5s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="score-bar" class="hidden">
  <span id="score-label">团友评分</span>
  <span id="score-value">50</span>
</div>
<div id="game">
  <div id="intro-screen">
    <h1>幸福旅行团</h1>
    <div style="color: #6e6e73; font-size: 15px; line-height: 1.7;">三天三夜 白天黑夜 · 幸福路风景区</div>
    <div style="margin-top: 6px; font-size: 14px; color: #86868b;">公司报的团。你没得选。</div>
    <div style="margin-top: 4px; font-size: 12px; color: #aeaeb2;">Ob-Clintc 作品</div>
    <div style="margin-top: 44px;">
      <button class="option-btn" onclick="startGame()">上车</button>
    </div>
  </div>
  <div id="game-content" class="hidden"></div>
</div>
<script>
const EVENTS = [
// ===== N级 (8个) =====
{
  id: "N1", rarity: "N", timeSlot: 0,
  title: "大巴选座",
  rounds: [
    {
      scene: "那辆大巴。车门一开我整个人往后退了半步——柴油味混着不知道谁拆的老坛酸菜面，直接糊在脸上。座椅套上\u201c幸福旅行\u201d四个字洗得只剩鬼影。我侧着身子拎包往里走，就剩两个空位了：过道这边那个大姐看到我的那一秒，眼睛亮了——亮片粉色的指甲啪啪拍着空椅面，那个节奏快得像在催命；最后排靠窗一个男的，降噪耳机戴着，帽檐压到鼻梁，整条胳膊横在旁边座位扶手上——那姿势就是三个字：别过来。",
      dialogues: [
        {char: "王姐", text: "来来来！坐这坐这！我给你占的！"},
        {char: "旁白", text: "我脚还没迈过去呢，她已经弯腰把我背包一把薅走了。手一抬——直接塞行李架上。动作连贯得像练过。我张了下嘴，什么都没来得及说。她替我做完了全部决定，用时两秒。"}
      ],
      options: [
        {text: "坐王姐旁边，笑了一下算打招呼", score: 2, nextRound: 1},
        {text: "假装没听见，走向最后排", score: -1, nextRound: 1},
        {text: "站过道里磨蹭，假装找行李架", score: 0, nextRound: 1},
        {text: "问导游副驾能不能坐", score: -2, consequence: "导游歪着头——下巴抬了一个小角度，笑容甜得跟工牌上印的一模一样：\u201c那是我的专座哦～不好意思呢～\u201d语气干净得一丝不耐烦都没有。但她转身的瞬间我看到了，她跟司机交换了一个眼神。那种\u201c又来一个\u201d的眼神。我坐下了。之后一整路她拿话筒报景点的时候，目光会扫过所有人——但到我这一排，那两只眼珠是滑过去的。不是没看。是经过但不落地。"}
      ]
    },
    {
      scene: "屁股刚挨上椅面，大巴就抖着动了。柴油味变浓了。不管坐哪反正这三个小时跑不了了。但坐下只是开始——旁边这个人的膝盖跟我的膝盖之间大概十五厘米。她身上那个花露水味已经飘进我鼻孔了。三个小时。十五厘米。",
      dialogues: [
        {char: "王姐", text: "你是做什么工作的呀？一个人来玩的？"},
        {char: "旁白", text: "她右手从裤兜里掏出一袋话梅，没问我要不要——直接塞我手里了。塑料袋口是用指甲撕开的那种。我手指还没合拢呢，她第三个问题已经出来了。"},
        {char: "旁白", text: "后排戴耳机的缩在最角落，脚翘上了前面椅背。前排有个男的打电话声音大到像在跟全车人开会。这就是接下来三小时。没有退出键。"}
      ],
      options: [
        {text: "接话梅，有一搭没一搭聊着", score: 2, consequence: "三个小时她嘴没停。侄子在哪上学、老公血糖多少、楼上邻居几点倒垃圾——每个话题之间没有间隔，像水龙头关不上。到站的时候我太阳穴在跳。但她弯腰帮我把包从行李架上拽下来了，又往我手心塞了两颗话梅。她的热情不需要通行证——直接闯进来就住下了。"},
        {text: "戴上耳机，假装没听到", score: -1, consequence: "她\u201c嗯？\u201d了一声——嘴角那个笑收了一下，非常快。然后转头跟前排那个人聊去了。没有生气的样子。但之后两个小时她分橘子、递纸巾、发湿巾——前排的人接了，对面的人接了。她的手经过我的方向时，不会停。不是不给我。是\u201c我\u201d已经不在她的动线里了。"},
        {text: "主动聊了几句，然后说\u201c我眯一会儿\u201d", score: 1, consequence: "她说\u201c行行行你休息\u201d的时候拍了一下我的手背——像拍小孩。我闭上眼。没睡着。一直醒着。她跟前排的人聊到笑出声了，然后突然压低音量，\u201c嘘——小声点，人家在睡呢。\u201d她记着我。这算体贴。但也算——我被安排了一个角色：那个\u201c在睡觉的人\u201d。"},
        {text: "反问她一堆问题，让她说个够", score: 0, consequence: "我问了一句\u201c姐您哪的人\u201d。她的眼角纹全展开了——接下来四十分钟像开了闸：跳槽、离婚、再嫁、女儿不听话。中间她拍着我大腿说\u201c你这孩子真会聊天！\u201d我什么都没聊。我只是按了播放键。到站的时候她挽着我胳膊下车的——那个力道，像认识了十年。我来不及建墙她就已经进来了。"}
      ]
    }
  ]
},
{
  id: "N2", rarity: "N", timeSlot: 0,
  title: "自我介绍",
  rounds: [
    {
      scene: "上了高速之后导游阿芳站起来了。左手抓扶手，右手举话筒——那个笑容练得跟反射一样，嘴角向上拉的弧度精确到毫米。工牌上印着一朵卡通向日葵，那朵花的精气神都比我足。然后她张嘴了。那句话。我从小就最怕的那句话。",
      dialogues: [
        {char: "导游阿芳", text: "大家～我们互相认识一下好不好呀～从前排开始，说一下名字、做什么工作的，再说一句对这次旅行的期待！"},
        {char: "旁白", text: "前排开始了。退休教师，做生意的，蜜月情侣。每个人说的时候整车人的头全转过来。三十多双眼睛集中在一个人身上。然后到我了。我背脊凉了一下。"},
        {char: "旁白", text: "我老板帮我报的团。你问我期待什么？我期待赶紧结束这调玩意儿回去上班。但我能说吗？嘴已经张开了。脑子还在找词。"}
      ],
      options: [
        {text: "报了真名和工作，敷衍了一句\u201c期待认识大家\u201d", score: 2, nextRound: 1},
        {text: "说了名字，职业说了个\u201c自由职业\u201d", score: 1, nextRound: 1},
        {text: "只说了名字，其他一笔带过", score: -1, nextRound: 1},
        {text: "说自己有点社恐，能不能跳过", score: -3, consequence: "车厢死了两秒。导游的笑容没动——但眼睛眩了一下，像电脑在缓冲。然后嘴巴张开了：\u201c没关系没关系～那我们继续下一位～\u201d不耐烦的影子都没有。但是——之后一路她拿话筒报景点的时候，目光扫全车。扫到我的时候快了那么零点几秒。不是不看。是省略。"}
      ]
    },
    {
      scene: "介绍完了。大巴继续开。但东西已经变了——我已经在这个封闭的铁盒子里有了一个身份。不管说了什么，别人已经在脑子里给我贴完标签了。导游放下话筒开始沿过道发零食的时候，旁边的人已经转过来了——还没等我取下耳机。",
      dialogues: [
        {char: "王姐", text: "哎呀你也是XX的？我表姐夫好像也在那附近上班！"},
        {char: "旁白", text: "不对，我说的不是XX。但她已经嘴上打了三个弯拐到表姐夫的体检报告上去了。我的嘴巴还张着，没有插嘴的缝。"},
        {char: "拍照叔", text: "年轻人出来散散心好！工作重要，身体更重要！"},
        {char: "旁白", text: "他说这话的时候用指头点着我。那个动作——像老师在叫学生。我还没开口呢，他们已经把我的剧本写好了。"}
      ],
      options: [
        {text: "顺着聊，随便他们怎么理解", score: 1, consequence: "接下来三天我发现了：第一分钟说出口的每个字都被水泥封死了。王姐管我叫\u201c小X\u201d，嘴巴一张就是那个音调——像认识了我二十年的那种。拍照叔每次看到我就\u201c年轻人别太累\u201d。我已经活在了一个他们编的角色里。这个角色跟我没有半毛钱关系。但纠正的窗口已经关了。"},
        {text: "纠正了一下：\u201c不是XX哈，我自己做点东西\u201d", score: 0, consequence: "王姐\u201c哦哦哦\u201d了一声，眼睛弯了一下但嘴没停——然后继续按她的版本往下聊。我说什么不重要。她要的不是信息，是一个接球的人。下一次提到我，她还是说\u201c那个在XX上班的小X\u201d。我的纠正根本没被录入。"},
        {text: "反问了一句\u201c您是做什么的来着？\u201d把话题甩回去", score: 1, consequence: "王姐一听就不一样了——肩膀往后靠，两只手开始比划。接下来十五分钟：职业生涯、跳槽经历、退休金多少、前老板有多坑。我一个字都不用说。代价是我现在装了一脑子她的事。而\u201c听了别人的事\u201d在她看来等于\u201c自己人了\u201d。又近了一步。我没同意过这个距离。"},
        {text: "笑了笑说\u201c一会再聊\u201d，戴上耳机", score: -2, consequence: "她说了句\u201c行你忙你忙\u201d，手在空中摆了一下。很自然。转头跟前排聊去了。但五分钟后我注意到——她聊天的时候声音没压低。之前对着我的时候她会压。现在不了。不是故意大声。是我已经从\u201c旁边有人注意一下\u201d的名单里被划掉了。"}
      ]
    }
  ]
},
{
  id: "N3", rarity: "N", timeSlot: 1,
  title: "合影",
  rounds: [
    {
      scene: "第一个景点。一块刻着\u201c幸福路风景区\u201d的大石头，底下缠着一圈开裂的红灯串。太阳全拍下来，地面白得反光，眼睛都睁不全。导游已经在把人往石头前面赶了。我后脖子开始发烫——刚转身想往树荫那边溜——",
      dialogues: [
        {char: "王姐", text: "诶！你别跑！过来过来！"},
        {char: "旁白", text: "她那嗓子穿透力太强了。我脊背绷了一下，脚步钉在原地。后面拍照叔已经蹲下去了，手机举到下巴高度找仰拍角度，嘴里念叨着\u201c好好好这个光\u201d。"},
        {char: "导游阿芳", text: "来来来！第一张合影！全体都有～大家挤一挤～"}
      ],
      options: [
        {text: "走过去了，站到人群最边上", score: 1, nextRound: 1},
        {text: "说\u201c我帮你们拍\u201d，站到镜头外面", score: 0, nextRound: 1},
        {text: "说不上相，往旁边走了", score: -2, nextRound: 1},
        {text: "假装在打电话，走远了", score: -1, consequence: "我举着手机贴耳朵，嘴里\u201c嗯嗯啊啊\u201d地对着空气说。走了五六步。背后没有人喊我。拍完了，群里发出来了。我用拇指划过每一张脸——没有我。本来就是我要的。但当晚躺床上又翻到那张照片的时候，所有人脸上都有太阳，肩紧贴着肩。我的位置——空的。像一个被抓掉的像素。"}
      ]
    },
    {
      scene: "合影第一关过了。但拍照叔没停——现在进入\u201c单人特写\u201d环节。他举着手机在人堆里穿，红光满面——那个劲儿就像婚礼上拉了一千块一个小时的摄影师。",
      dialogues: [
        {char: "拍照叔", text: "来！给你来个特写！这光线绝了！"},
        {char: "旁白", text: "他手机怼到我脸前半米的地方。胳膊伸得直直的。我嘴还没张开，快门已经响了——咔嚓一声。感觉我脸上的毛孔都被录进去了。"},
        {char: "旁白", text: "安静女生站在最远处那棵树下。一个人。手指在拽包带。没有人往她那边走。没有人叫她。"}

// ===== Game Logic v4: Multi-round, linear story, personality result =====

var state = {
  score: 50,
  satisfaction: [],
  choices: [],
  currentEventIndex: 0,
  currentRound: 0,
  dims: { face: 0, boundary: 0, individual: 0, collective: 0, confront: 0, absorb: 0, shortTerm: 0, longTerm: 0 }
};

// Sort events by timeSlot for linear story
var sortedEvents = EVENTS.slice().sort(function(a, b) {
  var slotDiff = a.timeSlot - b.timeSlot;
  if (slotDiff !== 0) return slotDiff;
  var rarityOrder = { N: 0, R: 1, SR: 2, SSR: 3 };
  return (rarityOrder[a.rarity] || 0) - (rarityOrder[b.rarity] || 0);
});

function startGame() {
  document.getElementById('intro-screen').classList.add('hidden');
  document.getElementById('game-content').classList.remove('hidden');
  document.getElementById('score-bar').classList.remove('hidden');
  state.currentEventIndex = 0;
  state.currentRound = 0;
  state.score = 50;
  state.satisfaction = [];
  state.choices = [];
  state.dims = { face: 0, boundary: 0, individual: 0, collective: 0, confront: 0, absorb: 0, shortTerm: 0, longTerm: 0 };
  showRound();
}

function showRound() {
  var event = sortedEvents[state.currentEventIndex];
  var round = event.rounds[state.currentRound];
  var container = document.getElementById('game-content');

  var html = '';

  // Show event title + rarity tag at first round
  if (state.currentRound === 0) {
    if (state.currentEventIndex > 0) {
      html += '<hr class="event-divider">';
    }
    var rarityLabels = { N: '\u65e5\u5e38\u5c0f\u4e8b', R: '\u8001\u9f20\u5c4e\u4e8b\u4ef6', SR: '\u65e0\u8bed\u4e8b\u4ef6', SSR: '\u70b8\u88c2\u4e8b\u4ef6\uff01' };
    html += '<span class="rarity-tag rarity-' + event.rarity + '">' + (rarityLabels[event.rarity] || event.rarity) + '</span>';
    html += '<div class="scene-desc" style="font-weight:600; font-size:19px; margin-bottom:20px;">' + escapeHtml(event.title) + '</div>';

    if (event.rarity === 'SSR') {
      document.body.classList.add('flash-white');
      setTimeout(function() { document.body.classList.remove('flash-white'); }, 600);
    }
  }

  // Scene
  html += '<div class="scene-desc fade-in">' + escapeHtml(round.scene) + '</div>';

  // Dialogues
  if (round.dialogues) {
    round.dialogues.forEach(function(d) {
      if (d.char === '\u65c1\u767d') {
        html += '<div class="narrator fade-in">' + escapeHtml(d.text) + '</div>';
      } else {
        html += '<div class="dialogue fade-in"><span class="char-name" data-char="' + escapeHtml(d.char) + '">' + escapeHtml(d.char) + '\uff1a</span>' + escapeHtml(d.text) + '</div>';
      }
    });
  }

  // Options
  html += '<div class="options fade-in" id="current-options">';
  round.options.forEach(function(opt, i) {
    html += '<button class="option-btn" data-idx="' + i + '" onclick="selectOption(' + i + ')">' + escapeHtml(opt.text) + '</button>';
  });
  html += '</div>';

  container.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectOption(index) {
  var event = sortedEvents[state.currentEventIndex];
  var round = event.rounds[state.currentRound];
  var opt = round.options[index];

  // Disable all buttons in current options, highlight selected, fade others
  var optionsContainer = document.getElementById('current-options');
  var buttons = optionsContainer ? optionsContainer.querySelectorAll('.option-btn') : [];
  buttons.forEach(function(btn) {
    btn.disabled = true;
    if (parseInt(btn.getAttribute('data-idx')) === index) {
      btn.classList.add('selected');
    } else {
      btn.style.opacity = '0.3';
      btn.style.transition = 'opacity 0.4s';
    }
  });

  // Update score
  var oldScore = state.score;
  state.score = Math.max(0, Math.min(100, state.score + opt.score));
  updateScoreDisplay(oldScore, state.score);

  // Update personality dimensions
  updateDimensions(opt.score, index);

  // Record choice
  state.choices.push({
    eventId: event.id,
    round: state.currentRound,
    optionIndex: index,
    score: opt.score
  });

  // Show satisfaction inline below options after a brief pause
  setTimeout(function() {
    showSatisfaction(opt.consequence || null, opt.nextRound !== undefined ? opt.nextRound : -1);
  }, 500);
}

function showSatisfaction(consequence, nextRoundIndex) {
  var optionsContainer = document.getElementById('current-options');
  var satHtml = '<div class="satisfaction-picker fade-in" style="margin-top:16px;">';
  satHtml += '<div class="sat-label">\u4f60\u5bf9\u81ea\u5df1\u8fd9\u4e2a\u9009\u62e9\u6ee1\u610f\u5417\uff1f</div>';
  satHtml += '<div class="sat-options">';
  var satEmoji = ['\ud83d\ude24', '\ud83d\ude12', '\ud83d\ude10', '\ud83d\ude0f'];
  var satTexts = ['\u70e6\u6b7b\u4e86', '\u51d1\u5408', '\u8fd8\u884c\u5427', '\u723d'];
  satEmoji.forEach(function(emoji, i) {
    satHtml += '<button class="sat-btn" onclick="pickSatisfaction(' + i + ', ' + (consequence ? 'true' : 'false') + ', ' + nextRoundIndex + ')">';
    satHtml += '<span style="font-size:20px">' + emoji + '</span>';
    satHtml += '<span>' + satTexts[i] + '</span>';
    satHtml += '</button>';
  });
  satHtml += '</div></div>';
  optionsContainer.insertAdjacentHTML('afterend', satHtml);
}

function pickSatisfaction(level, hasConsequence, nextRoundIndex) {
  var satBtns = document.querySelectorAll('.sat-btn');
  satBtns.forEach(function(btn, i) {
    btn.disabled = true;
    if (i === level) {
      btn.classList.add('sat-selected');
    } else {
      btn.classList.add('sat-dimmed');
    }
  });

  state.satisfaction.push(level);

  if (hasConsequence) {
    var lastChoice = state.choices[state.choices.length - 1];
    var event = sortedEvents[state.currentEventIndex];
    var round = event.rounds[lastChoice.round];
    var opt = round.options[lastChoice.optionIndex];

    setTimeout(function() {
      showConsequence(opt.consequence);
    }, 400);
  } else if (nextRoundIndex >= 0) {
    setTimeout(function() {
      state.currentRound = nextRoundIndex;
      showRound();
    }, 600);
  }
}

function showConsequence(text) {
  var container = document.getElementById('game-content');
  var conseqHtml = '<div class="scene-desc fade-in" style="margin-top:24px; padding-top:20px; border-top:0.5px solid #e5e5e5;">' + escapeHtml(text) + '</div>';
  container.innerHTML += conseqHtml;

  // After consequence, move to next event
  setTimeout(function() {
    state.currentEventIndex++;
    state.currentRound = 0;
    if (state.currentEventIndex >= sortedEvents.length) {
      showEnding();
    } else {
      var contHtml = '<div class="fade-in" style="margin-top:32px; text-align:center;"><button class="option-btn" style="text-align:center; font-size:15px; color:#86868b;" onclick="showRound()">\u7ee7\u7eed</button></div>';
      container.innerHTML += contHtml;
    }
  }, 800);
}

function updateDimensions(score, optionIndex) {
  if (score >= 2) {
    state.dims.face += 1;
    state.dims.longTerm += 1;
    state.dims.absorb += 1;
  } else if (score <= -3) {
    state.dims.boundary += 2;
    state.dims.confront += 1;
    state.dims.shortTerm += 1;
  } else if (score <= -1) {
    state.dims.boundary += 1;
    state.dims.absorb += 1;
  } else {
    state.dims.individual += 1;
  }
  if (optionIndex >= 2 && score <= -3) {
    state.dims.collective += 1;
  }
  if (optionIndex <= 1 && score >= 0) {
    state.dims.individual += 1;
  }
}

function updateScoreDisplay(oldScore, newScore) {
  var el = document.getElementById('score-value');
  el.textContent = newScore;
  if (newScore > oldScore) {
    el.classList.remove('down');
    el.classList.add('up');
  } else if (newScore < oldScore) {
    el.classList.remove('up');
    el.classList.add('down');
  }
  setTimeout(function() {
    el.classList.remove('up');
    el.classList.remove('down');
  }, 1000);
}

function getPersonality() {
  var d = state.dims;
  var avgSat = state.satisfaction.length > 0 ? state.satisfaction.reduce(function(a, b) { return a + b; }, 0) / state.satisfaction.length : 1.5;

  var faceVsBoundary = d.face > d.boundary ? 'face' : 'boundary';
  var selfVsOther = d.individual > d.collective ? 'self' : 'other';
  var confrontVsAbsorb = d.confront > d.absorb ? 'confront' : 'absorb';

  if (faceVsBoundary === 'face' && confrontVsAbsorb === 'absorb') {
    if (avgSat < 1.2) {
      return {
        title: '\u4eba\u5f62\u5145\u7535\u5b9d',
        desc: '\u6240\u6709\u4eba\u90fd\u627e\u4f60\u501f\u52b2\u513f\u3002\u738b\u59d0\u627e\u4f60\u804a\u5929\u5145\u7535\u3001\u5bfc\u6e38\u627e\u4f60\u914d\u5408\u5145\u4e1a\u7ee9\u3001\u60c5\u4fa3\u627e\u4f60\u7b49\u4f4d\u5145\u65f6\u95f4\u3002\u4f60\u7535\u91cf\u52693%\u4e86\u6ca1\u4eba\u95ee\u8fc7\u4f60\u8981\u4e0d\u8981\u5145\u4e00\u4e0b\u3002'
      };
    }
    return {
      title: '\u670b\u53cb\u5708\u5927\u5192\u79cd',
      desc: '\u4f60\u5e2e\u6240\u6709\u4eba\u62cd\u7167\u3001\u5e2e\u6240\u6709\u4eba\u5360\u5ea7\u3001\u5e2e\u6240\u6709\u4eba\u8bf4\u597d\u8bdd\u3002\u56de\u6765\u4ee5\u540e\u4ed6\u4eec\u53d1\u4e86\u4e5d\u5bab\u683c\uff0c\u4f60\u4e00\u5f20\u90fd\u6ca1\u88ab@\u5230\u3002\u4f60\u7684\u4ed8\u51fa\u50cfwifi\u2014\u2014\u5927\u5bb6\u7528\u7740\u4f46\u6ca1\u4eba\u611f\u8c22\u4e2d\u56fd\u79fb\u52a8\u3002'
    };
  }

  if (faceVsBoundary === 'boundary' && confrontVsAbsorb === 'confront') {
    if (selfVsOther === 'other') {
      return {
        title: '\u6563\u88c5\u6b63\u4e49\u611f \u4fdd\u8d28\u671f\u4e09\u5929',
        desc: '\u4f60\u5e2e\u4e86\u4eba\u3001\u6000\u4e86\u56de\u53bb\u3001\u51fa\u4e86\u5934\u3002\u7136\u540e\u63a5\u4e0b\u6765\u4e24\u5929\u6ca1\u4eba\u8ddf\u4f60\u8bf4\u8bdd\u3002\u4f60\u5728\u8fd9\u4e2a\u56e2\u91cc\u7684\u7ed0\u53f7\u662f\u201c\u90a3\u4e2a\u591a\u7ba1\u95f2\u4e8b\u7684\u201d\u3002\u4f60\u4e0d\u540e\u6094\u3002\u4f46\u4e0b\u6b21\u4f60\u4f1a\u591a\u72b9\u8c6b\u4e09\u79d2\u3002'
      };
    }
    return {
      title: '\u56e2\u5efa\u6740\u624b \u4e13\u6cbb\u5404\u79cd\u4e0d\u670d',
      desc: '\u4f60\u8bf4\u4e86\u201c\u4e0d\u201d\u3001\u8bf4\u4e86\u201c\u51ed\u4ec0\u4e48\u201d\u3001\u8bf4\u4e86\u201c\u6211\u4e0d\u60f3\u201d\u3002\u5168\u8f66\u4eba\u770b\u4f60\u7684\u773c\u795e\u8ddf\u770b\u72c2\u4eba\u4f3c\u7684\u3002\u4f46\u4f60\u4e0d\u5728\u4e4e\u3002\u4f60\u56de\u5bb6\u4ee5\u540e\u6ca1\u4eba\u53d1\u4f60\u65c5\u884c\u7167\uff0c\u56e0\u4e3a\u6ca1\u4eba\u6562\u62cd\u4f60\u3002'
    };
  }

  if (faceVsBoundary === 'boundary' && confrontVsAbsorb === 'absorb') {
    return {
      title: '\u56e2\u5efa\u6d3b\u5316\u77f3',
      desc: '\u4f60\u6765\u4e86\uff0c\u4f60\u5750\u4e86\uff0c\u4f60\u5403\u4e86\uff0c\u4f60\u8d70\u4e86\u3002\u4e09\u5929\u4ee5\u540e\u6ca1\u4eba\u8bb0\u5f97\u4f60\u7684\u540d\u5b57\uff0c\u4f46\u4f60\u8bb0\u5f97\u6240\u6709\u4eba\u7684\u516b\u5366\u3002\u4f60\u7684\u65c5\u884c\u7167\u53ea\u6709\u98ce\u666f\u6ca1\u6709\u4eba\u3002\u76f8\u518c\u65e0\u6cd5\u8bc1\u660e\u4f60\u53c2\u52a0\u8fc7\u8fd9\u4e2a\u56e2\u3002\u4f60\u7684\u65c5\u884c\u603b\u7ed3\uff1a\u8fd8\u4e0d\u5982\u52a0\u73ed\u3002'
    };
  }

  if (faceVsBoundary === 'face' && confrontVsAbsorb === 'confront') {
    return {
      title: '\u5634\u66ff\u6ca1\u5634',
      desc: '\u6bcf\u6b21\u6709\u4eba\u505a\u4e86\u79bb\u8c31\u7684\u4e8b\uff0c\u4f60\u5fc3\u91cc\u7684\u5c0f\u5267\u573a\u90fd\u6f14\u5b8c\u4e86\uff0c\u4f46\u4f60\u4e00\u4e2a\u5b57\u90fd\u6ca1\u8bf4\u51fa\u6765\u3002\u4f60\u6709\u4e00\u767e\u53e5\u60f3\u6000\u7684\u8bdd\u5168\u54bd\u56de\u53bb\u4e86\u3002\u56de\u53bb\u4ee5\u540e\u8ddf\u670b\u53cb\u5410\u69fd\u5f97\u53e3\u5410\u767d\u6cab\uff0c\u5f53\u65f6\u4e00\u53e5\u6ca1\u653e\u3002'
    };
  }

  if (selfVsOther === 'other') {
    return {
      title: '\u56e2\u5185\u5988\u5988 \u4f46\u6ca1\u4eba\u53eb\u4f60\u5988',
      desc: '\u4f60\u603b\u662f\u6ce8\u610f\u5230\u89d2\u843d\u91cc\u7684\u4eba\u3001\u88ab\u6324\u5f00\u7684\u4eba\u3001\u6ca1\u4eba\u642d\u7406\u7684\u4eba\u3002\u4f60\u64cd\u4e86\u5fc3\uff0c\u51fa\u4e86\u529b\uff0c\u4ed8\u4e86\u4ee3\u4ef7\u3002\u7136\u540e\u4ed6\u4eec\u8c22\u4e86\u4f60\u4e00\u53e5\u5c31\u62c9\u5012\u4e86\u3002\u4f60\u7684\u4ed8\u51fa\u50cf\u5916\u5356\u5c0f\u54e5\u2014\u2014\u51c6\u65f6\u9001\u5230\u7684\u65f6\u5019\u6ca1\u4eba\u8bf4\u8c22\u8c22\uff0c\u665a\u4e86\u4e94\u5206\u949f\u5c31\u7ed9\u5dee\u8bc4\u3002'
    };
  }

  // Default
  return {
    title: '\u8868\u9762\u548c\u6c14 \u5b9e\u9645\u5168\u8bb0\u7740',
    desc: '\u4f60\u7b11\u7740\u8bf4\u4e86\u4e09\u5929\u7684\u201c\u6ca1\u4e8b\u201d\u201c\u90fd\u884c\u201d\u201c\u968f\u4fbf\u201d\u3002\u56de\u6765\u4ee5\u540e\u62c9\u9ed1\u4e86\u56db\u4e2a\u4eba\u3002\u4f60\u7684\u597d\u813e\u6c14\u662f\u6709\u6709\u6548\u671f\u7684\uff0c\u8fd9\u8d9f\u65c5\u884c\u521a\u597d\u628a\u5b83\u7528\u5b8c\u4e86\u3002'
  };
}

function showEnding() {
  var container = document.getElementById('game-content');
  var personality = getPersonality();
  var avgSat = state.satisfaction.length > 0 ? (state.satisfaction.reduce(function(a, b) { return a + b; }, 0) / state.satisfaction.length).toFixed(1) : '?';

  var html = '<hr class="event-divider">';

  html += '<div class="scene-desc fade-in" style="font-weight:600; font-size:19px; margin-bottom:20px;">\u56de\u7a0b</div>';
  html += '<div class="scene-desc fade-in">\u5927\u5df4\u4e0a\u4e86\u9ad8\u901f\u3002\u7a97\u5916\u662f\u7070\u8272\u7684\u62a4\u680f\u4e00\u6761\u4e00\u6761\u5f80\u540e\u9000\u3002\u4f60\u7ec8\u4e8e\u53ef\u4ee5\u95ed\u773c\u4e86\u3002\u4e09\u5929\u7ed3\u675f\u4e86\u3002</div>';
  html += '<div class="narrator fade-in">\u660e\u5929\u5468\u4e00\u3002\u4f60\u7684\u95f9\u949f\u4f1a\u5728\u4e03\u70b9\u54cd\u3002\u4f60\u4f1a\u5750\u5730\u94c1\u3001\u6253\u5361\u3001\u5f00\u7535\u8111\u3001\u56de\u6d88\u606f\u3002\u4f60\u4f1a\u89c9\u5f97\u2014\u2014\u4e0a\u73ed\u4e5f\u6ca1\u90a3\u4e48\u96be\u53d7\u3002</div>';

  html += '<div class="ending-section">';
  html += '<div class="ending-score">' + state.score + ' \u5206</div>';
  var avgSatNum = state.satisfaction.length > 0 ? state.satisfaction.reduce(function(a, b) { return a + b; }, 0) / state.satisfaction.length : 1.5;
  var scoreTitle = getScoreTitle(state.score, avgSatNum);
  html += '<div class="ending-highlight" style="font-size:18px; font-weight:600; margin:8px 0;">' + scoreTitle.name + '</div>';
  html += '<div class="ending-text">' + scoreTitle.comment + '</div>';
  html += '</div>';

  html += '<div class="ending-section">';
  html += '<div class="ending-text">\u4f60\u7684\u793e\u4f1a\u751f\u5b58\u4eba\u683c\uff1a</div>';
  html += '<div class="ending-highlight" style="font-size:22px; font-weight:700; margin:16px 0;">' + escapeHtml(personality.title) + '</div>';
  html += '<div class="scene-desc">' + escapeHtml(personality.desc) + '</div>';
  html += '</div>';

  html += '<div class="ending-section">';
  html += '<div class="ending-text">\u4e09\u5929\u91cc\u4f60\u7684\u5e73\u5747\u5fc3\u60c5\u6307\u6570\uff1a' + avgSat + ' / 3</div>';
  html += '<div class="ending-text" style="font-size:13px; color:#aeaeb2;">\uff080=\u70e6\u6b7b\u4e86 3=\u5b8c\u5168\u65e0\u6240\u8c13\uff09</div>';
  html += '</div>';

  html += '<div style="text-align:center; margin-top:32px; font-size:12px; color:#aeaeb2;">Ob-Clintc \u4f5c\u54c1</div>';
  html += '<div style="text-align:center;"><button class="restart-btn" onclick="location.reload()">\u518d\u6765\u4e00\u6b21</button></div>';

  container.innerHTML += html;
  document.getElementById('score-bar').classList.add('hidden');

  try {
    fetch('./api/record', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ choices: state.choices, satisfaction: state.satisfaction, score: state.score, personality: personality.title })
    });
  } catch(e) {}
}

function getScoreTitle(score, avgSat) {
  // avgSat: 0-3, score: 0-100
  var highLike = score >= 55;
  var highSat = avgSat >= 1.8;

  if (highLike && highSat) {
    // Both like you AND you felt good
    if (score >= 80) return { name: '\u4eba\u95f4\u6e05\u9192\u7684\u5e78\u8fd0\u513f', comment: '\u522b\u4eba\u559c\u6b22\u4f60\uff0c\u4f60\u4e5f\u6ca1\u59d4\u5c48\u81ea\u5df1\u3002\u8fd9\u79cd\u7ed3\u679c\u8981\u4e48\u662f\u4f60\u8fd0\u6c14\u597d\uff0c\u8981\u4e48\u662f\u4f60\u60c5\u5546\u9ad8\u5f97\u79bb\u8c31\u3002\u4e0d\u7ba1\u54ea\u79cd\u2014\u2014\u4e0b\u6b21\u4e0d\u4e00\u5b9a\u6709\u8fd9\u8fd0\u6c14\u3002' };
    return { name: '\u53cc\u8d62\u73a9\u5bb6', comment: '\u56e2\u53cb\u89c9\u5f97\u4f60\u8fd9\u4eba\u884c\uff0c\u4f60\u81ea\u5df1\u4e5f\u6ca1\u89c9\u5f97\u592a\u96be\u53d7\u3002\u4f60\u662f\u600e\u4e48\u505a\u5230\u7684\uff1f\u6559\u6559\u6211\u3002' };
  }

  if (highLike && !highSat) {
    // Others like you, but YOU felt like shit
    if (score >= 80) return { name: '\u5168\u5458\u6ee1\u610f \u5c31\u4f60\u6ca1\u6ee1\u610f', comment: '\u5927\u5bb6\u90fd\u8212\u670d\u4e86\uff0c\u5c31\u4f60\u6ca1\u8212\u670d\u3002\u606d\u559c\u4f60\uff0c\u793e\u755c\u672c\u755c\u3002\u4f60\u7684\u7b11\u5bb9\u80cc\u540e\u5168\u662f\u54ac\u7a0b\u7684\u7259\u5370\u3002\u4f60\u8fd9\u4e09\u5929\u6d3b\u5f97\u50cf\u5ba2\u670d\u7535\u8bdd\u91cc\u90a3\u4e2a\u6c38\u8fdc\u6e29\u67d4\u7684\u58f0\u97f3\u3002' };
    return { name: '\u8d54\u672c\u8d5a\u543f', comment: '\u4ed6\u4eec\u559c\u6b22\u4f60\u3002\u4f46\u4f60\u5fc3\u91cc\u6e05\u695a\u8fd9\u4e2a\u201c\u559c\u6b22\u201d\u662f\u4f60\u5fcd\u51fa\u6765\u7684\u3002\u503c\u5417\uff1f\u4f60\u5fc3\u91cc\u6709\u6570\u3002\u53cd\u6b63\u4ee5\u540e\u4e0d\u4f1a\u518d\u62a5\u56e2\u4e86\u3002' };
  }

  if (!highLike && highSat) {
    // You felt great, but everyone hates you
    if (score <= 20) return { name: '\u5feb\u4e50\u7684\u6df7\u86cb', comment: '\u4f60\u8fc7\u5f97\u5f88\u723d\u3002\u4ee3\u4ef7\u662f\u4ee5\u540e\u6ca1\u4eba\u7ea6\u4f60\u4e86\u3002\u503c\u4e0d\u503c\u4f60\u81ea\u5df1\u6e05\u695a\u3002\u53cd\u6b63\u4f60\u770b\u8d77\u6765\u633a\u6e05\u695a\u7684\u3002' };
    return { name: '\u81ea\u7531\u4eba', comment: '\u4f60\u6d3b\u5f97\u6311\u4e0d\u51fa\u6bdb\u75c5\uff0c\u56e2\u53cb\u5bf9\u4f60\u6311\u51fa\u4e86\u4e00\u5806\u3002\u4f60\u4e0d\u5728\u4e4e\u3002\u4f60\u7684\u4e16\u754c\u91cc\u201c\u88ab\u559c\u6b22\u201d\u4ece\u6765\u4e0d\u5728\u5f85\u529e\u4e8b\u9879\u91cc\u3002' };
  }

  // Low like, low sat — worst of both worlds
  if (score <= 20) return { name: '\u4eba\u95f4\u5931\u683c', comment: '\u6ca1\u6709\u4eba\u7231\u4f60\u3002\u4f46\u5176\u4ed6\u4eba\u90fd\u662f\u795e\u7ecf\u75c5\u3002\u5982\u4f55\u5462\uff1f\u53c8\u80fd\u600e\uff1f\u4f60\u53cd\u6b63\u660e\u5929\u8fd8\u5f97\u4e0a\u73ed\u3002' };
  return { name: '\u4e24\u5934\u4e0d\u8ba8\u597d', comment: '\u4f60\u65e2\u6ca1\u8ba9\u522b\u4eba\u8212\u670d\uff0c\u4e5f\u6ca1\u8ba9\u81ea\u5df1\u8212\u670d\u3002\u8fd9\u8d9f\u65c5\u884c\u7eaf\u4e8f\u3002\u4e09\u5929\u5047\u671f\u4ea4\u4e86\u4e2a\u5bc2\u5bde\u3002' };
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

</script>
